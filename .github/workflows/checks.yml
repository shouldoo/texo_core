name: checks

on:
  pull_request:
    # edited: a changed description is checked again (job attribution)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolation (the list of names comes from the secret of the organisation)
        env:
          ISOLATION_PATTERNS: ${{ secrets.ISOLATION_PATTERNS }}
        run: python3 scripts/check_isolation.py
      - name: Skills structure
        run: python3 scripts/check_skills.py
      - name: Independent from any one assistant
        run: python3 scripts/check_agents.py

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -S warning setup/*.sh setup/git-hooks/commit-msg bin/texo
      - name: Python
        run: pipx run ruff==0.17.0 check texo scripts tests

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No assistant named as author in the commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE..$PR_HEAD"; else range="$PUSH_BEFORE..$PUSH_AFTER"; fi
          # a new branch, a tag or a forced push leaves no previous commit in the history: check all of it
          if [ "$EVENT" != pull_request ] && ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_AFTER"
          fi
          python3 scripts/check_attribution.py --range "$range"
      - name: No assistant named as author in the description of the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_attribution.py --env PR_BODY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the CLI in its image: the gitleaks action needs a licence on the repositories of an organisation
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact -v
